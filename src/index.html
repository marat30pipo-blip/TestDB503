<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поисковые системы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="page-title">Поисковики</h1>
    <div class="container">

        <div class="search-block google">
            <h2>GOOGLE</h2>
            <form action="https://www.google.com/search">
                <input type="text" name = "q" placeholder="Введите свой запрос">
                <input type = "submit" value="search">
            </form>
        </div>

        <div class="search-block yandex">
            <h2>YANDEX</h2>
            <form action="https://yandex.ru/search">
                <input type="text" name = "text" placeholder="Введите свой запрос">
                <input type = "submit" value="search">
            </form>
        </div>

        <div class="search-block mail">
            <h2>MAIL.RU</h2>
            <form action="https://mail.ru/search">
                <input type="text" name="text" placeholder="Введите свой запрос">
                <input type="submit" value="search">
            </form>
        </div>

        <div class="search-block yahoo">
            <h2>YAHOO</h2>
            <form action="https://de.search.yahoo.com/search">
                <input type="text" name = "p" placeholder="Введите свой запрос">
                <input type = "submit" value="search">
            </form>
        </div>

        <div class="search-block bing">
            <h2>BING</h2>
            <form action="https://www.bing.com/search">
                <input type="text" name = "q" placeholder="Введите свой запрос">
                <input type = "submit" value="search">
            </form>
        </div>

    </div>
</body>
</html>
